name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run lint

      - name: Lint
        run: pnpm run lint:eslint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify dist output
        run: pnpm run verify:dist
