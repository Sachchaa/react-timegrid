<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="react-timegrid — a full-featured, accessible React calendar component with month, week, and day views. Timezone-aware, i18n-ready, and lightweight."
    />
    <meta name="theme-color" content="#6d28d9" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="react-timegrid — React calendar component" />
    <meta
      property="og:description"
      content="A full-featured, accessible React calendar with month, week, and day views. Timezone-aware, i18n-ready, lightweight."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Avoid a flash of the wrong theme before React hydrates. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tg-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>react-timegrid — React calendar component</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
